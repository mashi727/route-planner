[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "route-planner"
version = "1.1.0"
description = "自転車ルート計画ツール - 斜度・走行距離の事前把握"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.scripts]
route-planner = "route_planner:main"

[tool.setuptools]
py-modules = [
    "route_planner",
    "config",
    "geocode",
    "elevation_cache",
    "Ui_GLW_Map2",
    "ver11",
]
packages = ["commands"]

[tool.setuptools.package-data]
"*" = ["frontend/*.html", "assets/*"]
