[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "route-planner"
version = "1.3.1"
description = "自転車ルート計画ツール - 斜度・走行距離の事前把握"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
route-planner = "route_planner.app:main"

[tool.setuptools]
packages = ["route_planner", "route_planner.ui"]

[tool.setuptools.package-data]
"route_planner" = ["frontend/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
