name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'dev'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build with PyInstaller
        run: |
          rm -rf build dist
          uv sync --extra build
          uv run python -m PyInstaller --noconfirm --clean route_planner.spec

      - name: Create DMG
        run: |
          # Create a folder for DMG contents
          mkdir -p dmg_contents
          cp -R dist/RoutePlanner.app dmg_contents/

          # Create DMG
          hdiutil create -volname "RoutePlanner" -srcfolder dmg_contents -ov -format UDZO RoutePlanner-macOS.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePlanner-macOS
          path: RoutePlanner-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build with PyInstaller
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          uv sync --extra build
          uv run python -m PyInstaller --noconfirm --clean route_planner.spec

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoutePlanner-Windows
          path: dist/RoutePlanner.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/RoutePlanner-macOS/RoutePlanner-macOS.dmg
            artifacts/RoutePlanner-Windows/RoutePlanner.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
